apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-agent
  namespace: meows
spec:
  template:
    spec:
      containers:
      - name: agent
        image: meows-controller:kindtest
        imagePullPolicy: Never
        env:
        - name: SLACK_API_URL
          value: http://fake-slack.meows.svc/api/
