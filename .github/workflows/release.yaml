name: Release

on:
  pull_request:
    paths:
      - VERSION
      - runner-images/runner.json
  push:
    branches:
      - main
    paths:
      - VERSION
      - runner-images/runner.json
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  version:
    name: Read and validate version
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_required: ${{ steps.version.outputs.release_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Validate inputs
        id: version
        run: |
          VERSION=$(cat VERSION)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format. Please use X.Y.Z"
            exit 1
          fi

          git fetch --tags
          # Reject existing tags only when VERSION changes in a pull request.
          if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] && ! git diff --quiet HEAD^1 HEAD -- VERSION; then
              echo "Tag v${VERSION} already exists"
              exit 1
            fi
            echo "release_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_required=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # Release runner images before publishing the controller image.
  get-released-versions:
    name: Get versions for runner images
    needs: version
    runs-on: ubuntu-26.04
    outputs:
      meows_version: ${{ steps.versions.outputs.meows_version }}
      runner_version: ${{ steps.versions.outputs.runner_version }}
      runner_sha256: ${{ steps.versions.outputs.runner_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read versions
        id: versions
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "meows_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "runner_version=$(jq -r '.version | ltrimstr("v")' runner-images/runner.json)" >> "$GITHUB_OUTPUT"
          echo "runner_sha256=$(jq -r '.sha256' runner-images/runner.json)" >> "$GITHUB_OUTPUT"

  build-and-push-runner-images:
    name: Build and push runner images
    needs:
     - get-released-versions
     - version
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-build-and-push-runner-images.yaml
    with:
      meows_version: ${{ needs.get-released-versions.outputs.meows_version }}
      runner_version: ${{ needs.get-released-versions.outputs.runner_version }}
      runner_sha256: ${{ needs.get-released-versions.outputs.runner_sha256 }}
      push_image: ${{ github.ref == 'refs/heads/main' }}
      # Build from the current commit for a new release, or use the release tag by default.
      # An empty source_ref falls back to v<meows_version> in the reusable workflow.
      source_ref: ${{ needs.version.outputs.release_required == 'true' && github.sha || '' }}

  push-controller-image:
    name: Push controller image
    if: ${{ github.ref == 'refs/heads/main' && needs.version.outputs.release_required == 'true' }}
    needs:
      - version
      - build-and-push-runner-images
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-with-takumi-guard
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make image
      - run: make tag push IMAGE_PREFIX=ghcr.io/cybozu-go/ IMAGE_TAG=${VERSION}
      - run: make tag push IMAGE_PREFIX=ghcr.io/cybozu-go/ IMAGE_TAG=latest

  release:
    name: Release on GitHub
    if: ${{ github.ref == 'refs/heads/main' && needs.version.outputs.release_required == 'true' }}
    needs:
      - version
      - push-controller-image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup git config
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
      - name: Create tag
        run: |
          git tag -a -m "Release v${VERSION}" "v${VERSION}"
          git tag -ln | grep "v${VERSION}"
          git push origin "v${VERSION}"
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            -t "Release v${VERSION}" \
            --generate-notes
